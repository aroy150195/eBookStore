name: PR Validation

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  detekt:
    name: Run Detekt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 20
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 20

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Upload Detekt report
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: app/build/reports/detekt/

  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 20
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 20

      - name: Run Unit Tests
        run: ./gradlew test